input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  if [event] {
    mutate {
      add_field => { "event_type" => "%{event}" }
    }
  }

  if [service] {
    mutate {
      add_field => { "service_name" => "%{service}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "deeplink-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
